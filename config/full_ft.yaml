# configs/full_ft.yaml — baseline: all parameters trainable

dataset_name: "dair-ai/emotion"
text_column: "text"
label_column: "label"
num_labels: 2
max_length: 128
seed: 42

model_name: "HuggingFaceTB/SmolLM2-360M"

epochs: 3
batch_size: 16
learning_rate: 2e-5          

output_dir: "results/checkpoints/full_ft"
mlflow_experiment_name: "efficient-fine-tuning-comparison"